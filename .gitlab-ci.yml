# You can find the Docker source files at https://openbeagle.org/beagleboard/ci-docker-images

variables:
  TRANSFER_METER_FREQUENCY: "5s"
  GIT_STRATEGY: "clone"
  GIT_DEPTH: 1
  REGISTRY_BASE: "registry.gfnd.rcn-ee.org:5000/ci"

stages:          # List of stages for jobs, and their order of execution
  - build
  - deploy

build-job:       # This job runs in the build stage, which runs first.
  stage: build
  tags:
    - libero-soc-v2024.2
  variables:
    BUILD_OPTIONS_DIRECTORY: "custom-fpga-design"
    REPO_UNDER_TEST: $CI_PROJECT_URL
    BRANCH_UNDER_TEST: $CI_COMMIT_REF_NAME
  rules:
    - if: $CI_PROJECT_ROOT_NAMESPACE == "beaglev-fire"
      variables:
        BUILD_OPTIONS_DIRECTORY: "build-options"
    - if: $CI_PROJECT_ROOT_NAMESPACE != "beaglev-fire"
      # Use the default variables' values.
        
  script:
    - export
    - source ~/Microchip/Microchip-FPGA-Tools-Setup/setup-microchip-tools.sh
    - echo "Building the gateware..."
    - python3 create-release.py $BUILD_OPTIONS_DIRECTORY
    - echo "Compile complete."
    - du -sh artifacts/bitstreams/*/LinuxProgramming/mpfs_bitstream.spi || exit 1
  artifacts:
    when: on_success
    paths:
      - artifacts/bitstreams
      - artifacts/build_logs
      - artifacts/debian
      - artifacts/debian-custom
    reports:
      junit: artifacts/tests_report.xml

build-job-next:
  stage: build
  allow_failure: true
  tags:
    - libero-soc-v2025.2
  variables:
    BUILD_OPTIONS_DIRECTORY: "custom-fpga-design"
    REPO_UNDER_TEST: $CI_PROJECT_URL
    BRANCH_UNDER_TEST: $CI_COMMIT_REF_NAME
  rules:
    - if: $CI_PROJECT_ROOT_NAMESPACE == "beaglev-fire"
      variables:
        BUILD_OPTIONS_DIRECTORY: "build-options"
    - if: $CI_PROJECT_ROOT_NAMESPACE != "beaglev-fire"
      # Use the default variables' values.
        
  script:
    - export
    - source ~/Microchip/Microchip-FPGA-Tools-Setup/setup-microchip-tools.sh
    - echo "Building the gateware..."
    - python3 create-release.py $BUILD_OPTIONS_DIRECTORY || echo "Warning python build with libero-soc-v2025.2 failed, but continuing..."
    - echo "Compile complete."
    - du -sh artifacts/bitstreams/*/LinuxProgramming/mpfs_bitstream.spi || echo "Warning bitstream build with libero-soc-v2025.2 failed, but continuing..."

pages:
  image: $REGISTRY_BASE/beagle-devscripts-kernel-debian-13-riscv64:latest
  stage: deploy
  tags:
    - docker-riscv64-ci
  variables:
    BUILD_OPTIONS_DIRECTORY: "custom-fpga-design"
    REPO_UNDER_TEST: $CI_PROJECT_URL
    BRANCH_UNDER_TEST: $CI_COMMIT_REF_NAME
    DEBIAN_CHANGELOG_PKG: "bbb.io-gateware-my-custom-fpga-design"
    DEBIAN_SRC: "debian-custom"
  rules:
    - if: $CI_PROJECT_ROOT_NAMESPACE == "beaglev-fire" && ($CI_COMMIT_TAG || $CI_COMMIT_BRANCH == "main")
      variables:
        BUILD_OPTIONS_DIRECTORY: "build-options"
        DEBIAN_CHANGELOG_PKG: "bbb.io-gateware"
        DEBIAN_SRC: "debian"
    - if: $CI_PROJECT_ROOT_NAMESPACE != "beaglev-fire"
        # Use the default variables' values.
  script:
    - rm -rf ./src/ || true
    - mkdir -p ./src/debian/ || true
    - rsync -av ./artifacts/$DEBIAN_SRC/* ./src/debian/
    - mkdir -p ./src/gateware-builds-tester || true
    - rsync -av ./artifacts ./src/gateware-builds-tester/
    - echo "$DEBIAN_CHANGELOG_PKG (1.$(LANG=C date +%Y%m%d).0-0~trixie) trixie; urgency=low" > ./src/debian/changelog
    - echo "" >> ./src/debian/changelog
    - echo "  * ci build of $CI_PROJECT_URL" >> ./src/debian/changelog
    - echo "" >> ./src/debian/changelog
    - echo " -- $GITLAB_USER_NAME <$GITLAB_USER_EMAIL>  $(LANG=C date -R)" >> ./src/debian/changelog
    - echo "" >> ./src/debian/changelog
    - cat ./src/debian/changelog
    - cd ./src/ ; debuild -b -us -uc ; cd ../
    - mkdir -p ./public/dists/stable/main/binary-riscv64/
    - mkdir -p ./public/pool
    - mkdir -p /opt/gateware/${CI_PROJECT_PATH}/${CI_PIPELINE_ID}/pool/ || true
    - cp -v *.deb ./public/pool/ || true
    - cp -v *.deb /opt/gateware/${CI_PROJECT_PATH}/${CI_PIPELINE_ID}/pool/ || true
    - cp -v *.build ./public/ || true
    - cp -v *.build /opt/gateware/${CI_PROJECT_PATH}/${CI_PIPELINE_ID}/ || true
    - cp -v *.buildinfo ./public/ || true
    - cp -v *.buildinfo /opt/gateware/${CI_PROJECT_PATH}/${CI_PIPELINE_ID}/ || true
    - echo "$CI_PIPELINE_ID" > /opt/gateware/${CI_PROJECT_PATH}/latest
    - touch /opt/gateware/${CI_PROJECT_PATH}/${CI_PIPELINE_ID}/.uploaded
    - cd ./public ; dpkg-scanpackages ./pool/ | gzip > ./dists/stable/main/binary-riscv64/Packages.gz || true ; cd ../
    - apindex public
  artifacts:
    when: on_success
    paths:
      - public
